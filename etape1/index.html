<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons</title>
   
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="table_container">
        <!-- Tableau statique : entête + 3 lignes (énoncé TP slides 7 et 8) -->
        <table>
            <tr>
                <th>N°</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Points</th>
                <th>Select</th>
            </tr>
            <!-- Chaque colonne reçoit sa classe : col_number, col_text, col_chkbox (énoncé TP slide 9) -->
            <tr>
                <td class="col_number">1</td>
                <td class="col_text">Nom1</td>
                <td class="col_text">Prénom1</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
            <tr>
                <td class="col_number">2</td>
                <td class="col_text">Nom2</td>
                <td class="col_text">Prénom2</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
            <tr>
                <td class="col_number">3</td>
                <td class="col_text">Nom3</td>
                <td class="col_text">Prénom3</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
        </table>
    </div>
</body>
</html>
