<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">
        <table>
            <tr>
                <th>N°</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Points</th>
                <th>Select</th>
            </tr>
        </table>
        <!-- Espace résumé, juste au-dessous du tableau : p1 = nombre de lignes, p3 = total des points (énoncé TP slide 33) -->
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s)= 0</p>
        </div>
        <!-- Le bouton Ajouter appelle maintenant doInsert (énoncé TP slide 44) ; onclick en ligne : slides 20 et 22 du cours -->
        <button onclick="doInsert('nom', 'prenom', 10)">Ajouter</button>
        <button onclick="consoleTableau()">Console Tableau</button>
    </div>
    <!-- Script externe à la fin du body : slides 24 et 27 du cours -->
    <script src="script.js"></script>
</body>
</html>
